<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 470" width="1000" height="470" font-family="Helvetica, Arial, sans-serif">
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#111111"/>
    </marker>
    <marker id="ab" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#1d4ed8"/>
    </marker>
  </defs>
  <rect x="0" y="0" width="1000" height="470" fill="#ffffff"/>

  <!-- ХОСТ -->
  <rect x="40" y="10" width="420" height="424" fill="#f7f7f7" stroke="#111111" stroke-width="1.5"/>
  <text x="58" y="36" font-size="14.5" font-weight="bold" fill="#111111">MCP-ХОСТ — ИИ-приложение</text>
  <text x="58" y="54" font-size="12.5" fill="#555555">ваш агент · Claude Desktop · VS Code · Claude Code</text>

  <rect x="58" y="72" width="384" height="96" fill="#ffffff" stroke="#111111" stroke-width="1.5"/>
  <text x="76" y="96" font-size="14" font-weight="bold" fill="#111111">Модель + цикл агента</text>
  <text x="76" y="118" font-size="12.5" fill="#333333">видит один общий список инструментов со всех серверов</text>
  <text x="76" y="136" font-size="12.5" fill="#333333">и по-прежнему возвращает «имя + аргументы» —</text>
  <text x="76" y="154" font-size="12.5" fill="#333333">ровно как в ноутбуке практики 2</text>

  <line x1="250" y1="168" x2="250" y2="196" stroke="#111111" stroke-width="2" marker-end="url(#a)"/>
  <line x1="200" y1="196" x2="200" y2="170" stroke="#111111" stroke-width="2" marker-end="url(#a)"/>

  <rect x="58" y="200" width="384" height="84" fill="#ffffff" stroke="#1d4ed8" stroke-width="3"/>
  <text x="76" y="224" font-size="14" font-weight="bold" fill="#1d4ed8">MCP-клиент 1</text>
  <text x="76" y="246" font-size="12.5" fill="#333333">держит соединение с сервером A,</text>
  <text x="76" y="264" font-size="12.5" fill="#333333">переводит вызов модели в tools/call</text>

  <rect x="58" y="304" width="384" height="84" fill="#ffffff" stroke="#1d4ed8" stroke-width="3"/>
  <text x="76" y="328" font-size="14" font-weight="bold" fill="#1d4ed8">MCP-клиент 2</text>
  <text x="76" y="350" font-size="12.5" fill="#333333">держит соединение с сервером B —</text>
  <text x="76" y="368" font-size="12.5" fill="#333333">по одному клиенту на каждый сервер</text>

  <text x="58" y="410" font-size="12.5" fill="#555555">Диспетчер практики 2 — это «MCP-клиент»,</text>
  <text x="58" y="426" font-size="12.5" fill="#555555">написанный руками для одного процесса.</text>

  <!-- что видит модель -->
  <rect x="580" y="10" width="380" height="130" fill="#f2f2f2" stroke="#111111" stroke-width="1.5"/>
  <text x="598" y="34" font-size="14" font-weight="bold" fill="#111111">Что сервер отдаёт на tools/list</text>
  <g font-family="Menlo, Consolas, monospace" font-size="12" fill="#333333">
    <text x="598" y="58">"name":        "query_unload"</text>
    <text x="598" y="76">"description": "Сколько вагонов выгружено…"</text>
    <text x="598" y="94">"inputSchema": { date_from, date_to, road }</text>
  </g>
  <text x="598" y="118" font-size="12.5" font-weight="bold" fill="#111111">Тот же контракт, что в блоке 1.</text>
  <text x="598" y="134" font-size="12.5" fill="#333333">Модель не отличит его от инструмента из ноутбука.</text>

  <!-- СЕРВЕР A -->
  <rect x="580" y="176" width="380" height="132" fill="#ffffff" stroke="#111111" stroke-width="1.5"/>
  <text x="598" y="200" font-size="14" font-weight="bold" fill="#111111">MCP-сервер A — локальный, транспорт stdio</text>
  <text x="598" y="220" font-size="12.5" fill="#333333">практика 3: ваш logist-agent/mcp_server</text>
  <g font-family="Menlo, Consolas, monospace" font-size="12" fill="#333333">
    <text x="598" y="246">tools:     query_unload · query_load · find_wagons</text>
    <text x="598" y="266">resources: манифест витрин</text>
    <text x="598" y="286">prompts:   шаблон системного промпта</text>
  </g>

  <!-- СЕРВЕР B -->
  <rect x="580" y="320" width="380" height="88" fill="#ffffff" stroke="#111111" stroke-width="1.5"/>
  <text x="598" y="344" font-size="14" font-weight="bold" fill="#111111">MCP-сервер B — удалённый, Streamable HTTP</text>
  <text x="598" y="366" font-size="12.5" fill="#333333">чужой сервис: трекер задач, GitHub, база данных;</text>
  <text x="598" y="384" font-size="12.5" fill="#333333">один сервер обслуживает много клиентов</text>

  <!-- клиент 1 <-> сервер A -->
  <text x="510" y="212" font-size="12" font-weight="bold" fill="#1d4ed8" text-anchor="middle">tools/list · tools/call</text>
  <path d="M 446 222 L 574 222" fill="none" stroke="#1d4ed8" stroke-width="2.5" marker-end="url(#ab)"/>
  <path d="M 574 262 L 452 262" fill="none" stroke="#111111" stroke-width="2" marker-end="url(#a)"/>
  <text x="510" y="280" font-size="12" fill="#111111" text-anchor="middle">список · результат</text>

  <!-- клиент 2 <-> сервер B -->
  <text x="510" y="332" font-size="12" font-weight="bold" fill="#1d4ed8" text-anchor="middle">JSON-RPC 2.0</text>
  <path d="M 446 342 L 574 342" fill="none" stroke="#1d4ed8" stroke-width="2.5" marker-end="url(#ab)"/>
  <path d="M 574 376 L 452 376" fill="none" stroke="#111111" stroke-width="2" marker-end="url(#a)"/>

  <text x="500" y="460" font-size="14" font-weight="bold" fill="#111111" text-anchor="middle">MCP не заменяет инструменты. Это способ их поставлять — любому хосту, без адаптера под каждый.</text>
</svg>
