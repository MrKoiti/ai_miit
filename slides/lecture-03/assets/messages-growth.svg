<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 470" width="1000" height="470" font-family="Helvetica, Arial, sans-serif">
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#111111"/>
    </marker>
  </defs>
  <rect x="0" y="0" width="1000" height="470" fill="#ffffff"/>

  <text x="500" y="24" font-size="15" font-weight="bold" fill="#333333" text-anchor="middle">ЧТО УХОДИТ В МОДЕЛЬ НА КАЖДОМ ВЫЗОВЕ: ВЕСЬ СПИСОК messages ЦЕЛИКОМ</text>

  <!-- Вызов 1 -->
  <text x="150" y="62" font-size="15" font-weight="bold" fill="#111111" text-anchor="middle">Вызов модели 1</text>
  <g font-size="13">
    <rect x="50" y="340" width="200" height="40" fill="#f2f2f2" stroke="#111111" stroke-width="1.5"/>
    <text x="62" y="365" fill="#111111"><tspan font-weight="bold">system</tspan> · правила агента</text>
    <rect x="50" y="296" width="200" height="40" fill="#f2f2f2" stroke="#111111" stroke-width="1.5"/>
    <text x="62" y="321" fill="#111111"><tspan font-weight="bold">user</tspan> · «ЛСН, март 2021?»</text>
  </g>
  <text x="150" y="408" font-size="13" fill="#555555" text-anchor="middle">ответ: просьба позвать</text>
  <text x="150" y="426" font-size="13" fill="#555555" text-anchor="middle">query_unload</text>

  <line x1="265" y1="330" x2="325" y2="330" stroke="#111111" stroke-width="2" marker-end="url(#a)"/>

  <!-- Вызов 2 -->
  <text x="440" y="62" font-size="15" font-weight="bold" fill="#111111" text-anchor="middle">Вызов модели 2</text>
  <g font-size="13">
    <rect x="340" y="340" width="200" height="40" fill="#f2f2f2" stroke="#111111" stroke-width="1.5"/>
    <text x="352" y="365" fill="#111111"><tspan font-weight="bold">system</tspan> · правила агента</text>
    <rect x="340" y="296" width="200" height="40" fill="#f2f2f2" stroke="#111111" stroke-width="1.5"/>
    <text x="352" y="321" fill="#111111"><tspan font-weight="bold">user</tspan> · «ЛСН, март 2021?»</text>
    <rect x="340" y="252" width="200" height="40" fill="#ffffff" stroke="#1d4ed8" stroke-width="2.5"/>
    <text x="352" y="277" fill="#1d4ed8"><tspan font-weight="bold">assistant</tspan> · вызов + id</text>
    <rect x="340" y="208" width="200" height="40" fill="#ffffff" stroke="#1d4ed8" stroke-width="2.5"/>
    <text x="352" y="233" fill="#1d4ed8"><tspan font-weight="bold">tool</tspan> · 9 761</text>
  </g>
  <text x="440" y="408" font-size="13" fill="#555555" text-anchor="middle">ответ: «За март 2021</text>
  <text x="440" y="426" font-size="13" fill="#555555" text-anchor="middle">выгружено 9 761 вагон»</text>

  <line x1="555" y1="300" x2="615" y2="300" stroke="#111111" stroke-width="2" marker-end="url(#a)"/>

  <!-- Длинный цикл -->
  <text x="780" y="62" font-size="15" font-weight="bold" fill="#111111" text-anchor="middle">Через десять кругов</text>
  <g font-size="13">
    <rect x="630" y="340" width="300" height="40" fill="#f2f2f2" stroke="#111111" stroke-width="1.5"/>
    <text x="642" y="365" fill="#111111"><tspan font-weight="bold">system</tspan> · <tspan font-weight="bold">user</tspan></text>
    <rect x="630" y="100" width="300" height="236" fill="#ffffff" stroke="#1d4ed8" stroke-width="2.5" stroke-dasharray="8 5"/>
    <text x="780" y="200" fill="#1d4ed8" text-anchor="middle" font-weight="bold">10 × (вызов + результат)</text>
    <text x="780" y="222" fill="#1d4ed8" text-anchor="middle">каждый результат остаётся</text>
    <text x="780" y="240" fill="#1d4ed8" text-anchor="middle">в списке до конца цикла</text>
  </g>
  <text x="780" y="408" font-size="13" fill="#555555" text-anchor="middle">дороже на каждом вызове и хуже читается:</text>
  <text x="780" y="426" font-size="13" fill="#555555" text-anchor="middle">середину длинного контекста модель теряет</text>

  <text x="500" y="460" font-size="12" font-style="italic" fill="#555555" text-anchor="middle">Вызовы 1–2 — реальный прогон практики 2 (9 761 из agent_facts.json). Третья колонка — иллюстрация роста, не прогон.</text>
</svg>
