<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 460" width="1000" height="460" font-family="Helvetica, Arial, sans-serif">
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#1d4ed8"/>
    </marker>
  </defs>
  <rect x="0" y="0" width="1000" height="460" fill="#ffffff"/>

  <line x1="400" y1="0" x2="400" y2="420" stroke="#999999" stroke-width="2" stroke-dasharray="7 6"/>
  <text x="200" y="22" font-size="15" font-weight="bold" fill="#333333" text-anchor="middle">КРАТКОВРЕМЕННАЯ (РАБОЧАЯ)</text>
  <text x="700" y="22" font-size="15" font-weight="bold" fill="#333333" text-anchor="middle">ДОЛГОВРЕМЕННАЯ</text>

  <!-- рабочая память -->
  <rect x="30" y="44" width="340" height="250" fill="#f2f2f2" stroke="#111111" stroke-width="1.5"/>
  <text x="48" y="72" font-size="15" font-weight="bold" fill="#111111">Контекст текущего вызова</text>
  <g font-family="Menlo, Consolas, monospace" font-size="13" fill="#333333">
    <text x="48" y="104">messages = [</text>
    <text x="48" y="126">  system, user,</text>
    <text x="48" y="148">  assistant(вызов),</text>
    <text x="48" y="170">  tool(9 761), …</text>
    <text x="48" y="192">]</text>
  </g>
  <text x="48" y="232" font-size="13.5" fill="#111111">Закончился разговор —</text>
  <text x="48" y="252" font-size="13.5" fill="#111111">список исчез вместе с памятью.</text>
  <text x="48" y="280" font-size="12" font-style="italic" fill="#555555">Ограничена размером контекстного окна.</text>

  <!-- долговременная -->
  <g font-size="13.5">
    <rect x="440" y="44" width="530" height="76" fill="#ffffff" stroke="#1d4ed8" stroke-width="2.5"/>
    <text x="458" y="70" font-weight="bold" fill="#1d4ed8">Эпизодическая — опыт прошлых шагов</text>
    <text x="458" y="96" fill="#111111">«в прошлый раз пользователь уточнял период»</text>

    <rect x="440" y="132" width="530" height="76" fill="#ffffff" stroke="#1d4ed8" stroke-width="2.5"/>
    <text x="458" y="158" font-weight="bold" fill="#1d4ed8">Семантическая — знания о мире и о себе</text>
    <text x="458" y="184" fill="#111111">«работает с дорогой ЛСН», «отвечать в тысячах вагонов»</text>

    <rect x="440" y="220" width="530" height="76" fill="#f2f2f2" stroke="#111111" stroke-width="1.5"/>
    <text x="458" y="246" font-weight="bold" fill="#111111">Процедурная — как действовать</text>
    <text x="458" y="272" fill="#111111">неявно — веса модели; явно — код и промпт агента</text>
  </g>

  <!-- инструменты памяти -->
  <line x1="375" y1="120" x2="435" y2="100" stroke="#1d4ed8" stroke-width="2" marker-end="url(#a)" marker-start="url(#a)"/>
  <line x1="375" y1="170" x2="435" y2="170" stroke="#1d4ed8" stroke-width="2" marker-end="url(#a)" marker-start="url(#a)"/>
  <rect x="440" y="318" width="530" height="62" fill="#ffffff" stroke="#1d4ed8" stroke-width="1.5" stroke-dasharray="6 4"/>
  <text x="705" y="344" font-size="14" font-weight="bold" fill="#1d4ed8" text-anchor="middle">Мост между ними — инструменты «записать» и «найти»</text>
  <text x="705" y="366" font-size="13" fill="#333333" text-anchor="middle">модель просит, ваш код выполняет и хранит — как с query_unload</text>

  <text x="500" y="448" font-size="12" font-style="italic" fill="#555555" text-anchor="middle">Деление на виды памяти — по CoALA (Sumers et al., 2023). Примеры — из данных курса.</text>
</svg>
