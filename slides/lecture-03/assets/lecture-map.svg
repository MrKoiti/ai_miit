<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 470" width="1000" height="470" font-family="Helvetica, Arial, sans-serif">
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#111111"/>
    </marker>
    <marker id="ab" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#1d4ed8"/>
    </marker>
  </defs>
  <rect x="0" y="0" width="1000" height="470" fill="#ffffff"/>

  <!-- 4 · контекстное окно = список messages -->
  <rect x="30" y="60" width="330" height="330" fill="#f2f2f2" stroke="#111111" stroke-width="1.5"/>
  <text x="46" y="44" font-size="15" font-weight="bold" fill="#1d4ed8">4 · КОНТЕКСТНОЕ ОКНО</text>
  <text x="46" y="88" font-size="14.5" font-weight="bold" fill="#111111">Всё, что модель знает сейчас</text>
  <g font-family="Menlo, Consolas, monospace" font-size="13" fill="#333333">
    <text x="46" y="120">messages = [</text>
    <text x="46" y="142">  system,</text>
    <text x="46" y="164">  user,</text>
    <text x="46" y="186">  assistant(мысль + вызов),</text>
    <text x="46" y="208">  tool(результат),</text>
    <text x="46" y="230">  assistant(мысль + вызов),</text>
    <text x="46" y="252">  tool(результат), …</text>
    <text x="46" y="274">]</text>
  </g>
  <text x="46" y="312" font-size="13" fill="#111111">На каждом круге уходит в модель</text>
  <text x="46" y="332" font-size="13" fill="#111111">целиком — и растёт.</text>
  <text x="46" y="372" font-size="12" font-style="italic" fill="#555555">Закончился разговор — список исчез.</text>

  <!-- 2 · модель = рассуждение -->
  <rect x="470" y="60" width="240" height="96" rx="48" fill="#ffffff" stroke="#111111" stroke-width="2"/>
  <text x="590" y="94" font-size="16" font-weight="bold" fill="#111111" text-anchor="middle">МОДЕЛЬ</text>
  <text x="590" y="118" font-size="13" fill="#333333" text-anchor="middle">читает список, пишет мысль,</text>
  <text x="590" y="136" font-size="13" fill="#333333" text-anchor="middle">просит вызвать инструмент</text>
  <text x="740" y="80" font-size="15" font-weight="bold" fill="#1d4ed8">2 · РАССУЖДЕНИЕ</text>
  <text x="740" y="102" font-size="13" fill="#333333">какой инструмент</text>
  <text x="740" y="120" font-size="13" fill="#333333">и с какими аргументами</text>

  <!-- 1 · инструмент -->
  <rect x="440" y="250" width="300" height="118" fill="#ffffff" stroke="#1d4ed8" stroke-width="2.5"/>
  <text x="456" y="234" font-size="15" font-weight="bold" fill="#1d4ed8">1 · ИНСТРУМЕНТ</text>
  <text x="590" y="278" font-size="15" font-weight="bold" fill="#111111" text-anchor="middle">Код, который считает</text>
  <line x1="590" y1="292" x2="590" y2="356" stroke="#999999" stroke-width="1.5" stroke-dasharray="5 4"/>
  <text x="515" y="316" font-size="13" fill="#333333" text-anchor="middle">свой:</text>
  <text x="515" y="334" font-size="13" fill="#333333" text-anchor="middle">функция</text>
  <text x="515" y="352" font-size="13" fill="#333333" text-anchor="middle">в ноутбуке</text>
  <text x="665" y="316" font-size="13" fill="#1d4ed8" font-weight="bold" text-anchor="middle">MCP:</text>
  <text x="665" y="334" font-size="13" fill="#333333" text-anchor="middle">отдельный</text>
  <text x="665" y="352" font-size="13" fill="#333333" text-anchor="middle">процесс</text>

  <!-- 3 · память -->
  <rect x="790" y="250" width="180" height="118" fill="#ffffff" stroke="#1d4ed8" stroke-width="1.5" stroke-dasharray="6 4"/>
  <text x="806" y="234" font-size="15" font-weight="bold" fill="#1d4ed8">3 · ПАМЯТЬ</text>
  <text x="880" y="284" font-size="14" font-weight="bold" fill="#111111" text-anchor="middle">Хранилище</text>
  <text x="880" y="304" font-size="14" font-weight="bold" fill="#111111" text-anchor="middle">вне окна</text>
  <text x="880" y="330" font-size="12.5" fill="#333333" text-anchor="middle">файл, база —</text>
  <text x="880" y="348" font-size="12.5" fill="#333333" text-anchor="middle">переживает разговор</text>

  <!-- стрелки цикла -->
  <line x1="365" y1="108" x2="465" y2="108" stroke="#111111" stroke-width="2" marker-end="url(#a)"/>
  <text x="415" y="98" font-size="12" fill="#555555" text-anchor="middle">весь список</text>

  <line x1="590" y1="160" x2="590" y2="245" stroke="#111111" stroke-width="2" marker-end="url(#a)"/>
  <text x="604" y="200" font-size="12" fill="#555555">просьба: имя + аргументы</text>

  <path d="M 435 309 L 380 309 L 380 200 L 365 200" fill="none" stroke="#111111" stroke-width="2" marker-end="url(#a)"/>
  <text x="392" y="258" font-size="12" fill="#555555" transform="rotate(-90 392 258)" text-anchor="middle">результат — снова в список</text>

  <!-- память ↔ инструмент -->
  <line x1="745" y1="309" x2="785" y2="309" stroke="#1d4ed8" stroke-width="2" marker-end="url(#ab)" marker-start="url(#ab)"/>
  <text x="765" y="296" font-size="11.5" fill="#1d4ed8" text-anchor="middle">записать</text>
  <text x="765" y="330" font-size="11.5" fill="#1d4ed8" text-anchor="middle">найти</text>

  <!-- подпись -->
  <text x="500" y="430" font-size="14" fill="#111111" text-anchor="middle">Цикл run_agent из практики 2. Четыре блока лекции — четыре места этого цикла.</text>
  <text x="500" y="452" font-size="12" font-style="italic" fill="#555555" text-anchor="middle">Нумерация — порядок блоков сегодня. MCP меняет только то, где живёт блок 1.</text>
</svg>
